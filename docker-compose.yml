# Bedrock Dedicated Server.
# On every start the container asks Mojang for the current Linux BDS zip —
# the same release as Minecraft for Windows (Microsoft Store / Xbox app).
#
# Local:  docker compose up -d
# Unraid: use unraid/docker-compose.yml or the XML template.

services:
  minecraft:
    image: ghcr.io/genopimp/minecraft-server:latest
    build: .
    container_name: minecraft
    restart: unless-stopped
    stop_grace_period: 45s
    stdin_open: true
    tty: true
    ports:
      - "19132:19132/udp"
      - "19133:19133/udp"
    environment:
      EULA: "TRUE"
      VERSION: LATEST
      PUID: "99"
      PGID: "100"
      TZ: America/New_York
      SERVER_NAME: Vanilla Bedrock (always latest)
      DIFFICULTY: normal
      GAMEMODE: survival
      MAX_PLAYERS: "10"
      ONLINE_MODE: "true"
      BACKUP_ON_UPGRADE: "true"
      KEEP_BACKUPS: "2"
    volumes:
      - ${MINECRAFT_DATA:-./data}:/data
    mem_limit: 4g
    labels:
      net.unraid.docker.managed: composestack
      net.unraid.docker.icon: https://raw.githubusercontent.com/genopimp/minecraft-server/main/unraid/icon.png
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
