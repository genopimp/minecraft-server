name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rebuild the Java 25 runtime weekly. The Minecraft jar is still
    # fetched from Mojang on every container start, not baked in.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/genopimp/minecraft-server

jobs:
  test-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest vanilla metadata
        run: bash tests/test_fetch.sh

  publish:
    if: github.event_name != 'pull_request'
    needs: test-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 for smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mc-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fetch official jar inside image
        run: |
          mkdir -p "${RUNNER_TEMP}/mcdata"
          docker run --rm \
            -e EULA=TRUE \
            -e FETCH_ONLY=true \
            -e VERSION=LATEST \
            -e PUID=1000 \
            -e PGID=1000 \
            -v "${RUNNER_TEMP}/mcdata:/data" \
            mc-test:local
          test -s "${RUNNER_TEMP}/mcdata"/.current-version
          version="$(cat "${RUNNER_TEMP}/mcdata/.current-version")"
          test -s "${RUNNER_TEMP}/mcdata/versions/${version}/server.jar"
          echo "Installed ${version}"
          cat "${RUNNER_TEMP}/mcdata/.current-version"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
