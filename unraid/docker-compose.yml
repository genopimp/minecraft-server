# Unraid Compose Manager
# Copy to /mnt/user/appdata/minecraft-server/docker-compose.yml
# or add this repo path as a stack.
#
# After a Minecraft Java launcher update (or daily), restart the container
# so it re-fetches Mojang's latest.release server.jar.

services:
  minecraft:
    image: ghcr.io/genopimp/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    stop_grace_period: 60s
    stdin_open: true
    tty: true
    ports:
      - "25565:25565/tcp"
      - "25565:25565/udp"
    environment:
      EULA: "TRUE"
      VERSION: LATEST
      MEMORY: 4G
      PUID: "99"
      PGID: "100"
      TZ: America/New_York
      MOTD: Vanilla (always latest)
      DIFFICULTY: normal
      MAX_PLAYERS: "10"
      ONLINE_MODE: "true"
      BACKUP_ON_UPGRADE: "true"
      KEEP_BACKUPS: "2"
    volumes:
      - /mnt/user/appdata/minecraft-server:/data
    mem_limit: 6g
    labels:
      net.unraid.docker.managed: composestack
      net.unraid.docker.icon: https://minecraft.wiki/images/Grass_Block_JE7_BE6.png
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
