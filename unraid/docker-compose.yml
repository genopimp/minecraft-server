# Unraid Compose Manager
# Copy to /mnt/user/appdata/minecraft-server/docker-compose.yml
#
# After a Minecraft for Windows update (or daily), restart the container
# so it re-fetches Mojang's current Bedrock Dedicated Server zip.

services:
  minecraft:
    image: ghcr.io/genopimp/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    stop_grace_period: 45s
    stdin_open: true
    tty: true
    ports:
      - "19132:19132/udp"
      - "19133:19133/udp"
    environment:
      EULA: "TRUE"
      VERSION: LATEST
      PUID: "99"
      PGID: "100"
      TZ: America/New_York
      SERVER_NAME: Vanilla Bedrock (always latest)
      DIFFICULTY: normal
      GAMEMODE: survival
      MAX_PLAYERS: "10"
      ONLINE_MODE: "true"
      BACKUP_ON_UPGRADE: "true"
      KEEP_BACKUPS: "2"
    volumes:
      - /mnt/user/appdata/minecraft-server:/data
    mem_limit: 4g
    labels:
      net.unraid.docker.managed: composestack
      net.unraid.docker.icon: https://raw.githubusercontent.com/genopimp/minecraft-server/main/unraid/icon.png
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
